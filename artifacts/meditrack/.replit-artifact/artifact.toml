kind = "web"
previewPath = "/"
title = "MediTrack"
description = "An English-language personal medication schedule and dose tracker with browser-local persistence and a clearly labeled camera demo, not medical identification."
version = "1.0.0"
id = "artifacts/meditrack"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18784

[services.development]
run = "pnpm --filter @workspace/meditrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meditrack", "run", "build" ]
serve = "static"
publicDir = "artifacts/meditrack/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18784"
BASE_PATH = "/"
